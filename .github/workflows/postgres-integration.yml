name: SpecForge AI PostgreSQL Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: specforge-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: specforge
          POSTGRES_USER: specforge
          POSTGRES_PASSWORD: CiOnlyPassword12345678901234567890
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specforge -d specforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://specforge:CiOnlyPassword12345678901234567890@127.0.0.1:5432/specforge
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: ci-only-test-secret-key-12345678901234567890
      MIGRATION_MODE: alembic
      CORS_ORIGINS: https://localhost
      OPENAI_API_KEY: ""
      AI_PROVIDER: openai
      GIT_ALLOWED_ROOTS: ""
      LOG_LEVEL: INFO
      LOG_FORMAT: json

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U specforge -d specforge; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Run Alembic migrations
        working-directory: src
        run: python -m alembic upgrade head

      - name: Verify PostgreSQL schema
        working-directory: src
        run: |
          python -c "
          from sqlalchemy import inspect
          from app.database.session import engine

          inspector = inspect(engine)
          tables = set(inspector.get_table_names())

          required = {
              'users',
              'projects',
              'requirements',
              'backup_records',
              'operational_jobs',
          }

          missing = required - tables

          print('TABLE COUNT:', len(tables))
          print('REQUIRED TABLES:', sorted(required))

          if missing:
              raise SystemExit(
                  'Missing required tables: ' + ', '.join(sorted(missing))
              )

          print('POSTGRESQL SCHEMA: OK')
          "

      - name: Verify application database connection
        working-directory: src
        run: |
          python -c "
          from sqlalchemy import text
          from app.database.session import engine

          with engine.connect() as connection:
              value = connection.execute(text('SELECT 1')).scalar_one()

          assert value == 1
          print('DATABASE CONNECTION: OK')
          "

      - name: Run test suite
        run: python -m pytest src/tests -q

